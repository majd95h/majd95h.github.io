# Render Blueprint for the FastAPI backend (free plan).
services:
  - type: web
    name: majd-hsien-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: SMTP_USER
        value: majdhsien1@gmail.com
      - key: CONTACT_TO
        value: majdhsien1@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
